name: Build OxiDNS Release

# Thin shell: reads build.config.yml and forwards the parameters to the
# reusable workflow hosted in the upstream svenshi/oxidns repo.
#
# `ref` (required) selects the upstream source ref to build:
#   * a tag (v1.2.0)    → builds and publishes a normal release
#   * a branch (main)   → builds and publishes a prerelease tagged
#                         `branch-<sanitized>-<sha7>`
#   * a commit SHA      → same as branch
#
# `workflow_ref` (optional) selects which ref of custom-build.yml is used
# as the build pipeline. Defaults to `ref` so the pipeline stays
# version-locked with the source. Override to e.g. `main` to backfill an
# old release with the latest pipeline.
#
# To build "upstream's latest release" without knowing the tag, run
# `Watch Upstream` (workflow_dispatch with force: true) — that workflow
# performs the resolution and then calls this one with explicit values.
#
# (Note: GitHub Actions does NOT allow `needs.*.outputs.*` in `uses:` for
# reusable workflows — only `inputs.*` / `vars.*` / `github.*`. That is
# why ref resolution must happen in the caller, not here.)

on:
  workflow_call:
    inputs:
      ref:
        description: 'Upstream git ref to build (branch / tag / SHA).'
        required: true
        type: string
      workflow_ref:
        description: 'Ref of custom-build.yml to use. Empty = same as `ref`.'
        required: false
        default: ''
        type: string
  workflow_dispatch:
    inputs:
      ref:
        description: 'Upstream git ref to build (branch / tag / SHA, e.g. v1.2.0, main, abc1234).'
        required: true
        type: string
      workflow_ref:
        description: 'Ref of custom-build.yml to use. Leave empty to use the same ref as the source. Override to e.g. `main` when an old release pre-dates custom-build.yml.'
        required: false
        default: ''
        type: string

permissions:
  contents: write

jobs:
  # ---------------------------------------------------------------------------
  # Parse build.config.yml and compute the release tag + prerelease flag for
  # the given source ref. These outputs flow through `with:` (which supports
  # `needs.*.outputs.*`), unlike the `uses:` ref which must come from inputs.
  # ---------------------------------------------------------------------------
  plan:
    runs-on: ubuntu-latest
    outputs:
      bundle:      ${{ steps.config.outputs.bundle }}
      features:    ${{ steps.config.outputs.features }}
      targets:     ${{ steps.config.outputs.targets }}
      upx:         ${{ steps.config.outputs.upx }}
      make_deb:    ${{ steps.config.outputs.make_deb }}
      release_tag: ${{ steps.tag.outputs.release_tag }}
      prerelease:  ${{ steps.tag.outputs.prerelease }}
    steps:
      - uses: actions/checkout@v4

      - name: Install yq
        run: |
          sudo wget -qO /usr/local/bin/yq \
            https://github.com/mikefarah/yq/releases/latest/download/yq_linux_amd64
          sudo chmod +x /usr/local/bin/yq

      - id: config
        name: Read build.config.yml
        run: |
          set -euo pipefail
          {
            echo "bundle=$(yq '.bundle' build.config.yml)"
            echo "features=$(yq -r '.features // [] | join(",")' build.config.yml)"
            echo "targets=$(yq -o=json -I=0 '.targets' build.config.yml)"
            echo "upx=$(yq '.upx' build.config.yml)"
            echo "make_deb=$(yq '.make_deb' build.config.yml)"
            echo "upstream=$(yq '.upstream' build.config.yml)"
          } >> "$GITHUB_OUTPUT"

      - id: tag
        name: Compute release_tag and prerelease flag
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REF: ${{ inputs.ref }}
          UPSTREAM: ${{ steps.config.outputs.upstream }}
        run: |
          set -euo pipefail

          # For non-semver refs, append a 7-char commit SHA so the release tag
          # is unique per commit and re-triggers replace the matching release
          # cleanly instead of polluting the feed.
          SHA=$(gh api "repos/$UPSTREAM/commits/$REF" --jq '.sha' 2>/dev/null | head -c 7 || echo "")

          # A semver-ish tag (v1.2.3 / v1.2.3-rc1) → publish as a normal
          # release. Anything else → publish as a prerelease tagged
          # `branch-<sanitized>-<sha7>`.
          if [[ "$REF" =~ ^v[0-9]+\.[0-9]+ ]]; then
            RELEASE_TAG="$REF"
            PRERELEASE=false
          else
            SANITIZED=$(echo "$REF" | tr '/ ' '--' | tr -cd 'a-zA-Z0-9._-')
            if [ -n "$SHA" ]; then
              RELEASE_TAG="branch-${SANITIZED}-${SHA}"
            else
              RELEASE_TAG="branch-${SANITIZED}"
            fi
            PRERELEASE=true
          fi

          {
            echo "release_tag=$RELEASE_TAG"
            echo "prerelease=$PRERELEASE"
          } >> "$GITHUB_OUTPUT"

          echo "release_tag=$RELEASE_TAG"
          echo "prerelease=$PRERELEASE"

  # ---------------------------------------------------------------------------
  # Call the upstream reusable workflow.
  #
  # `uses:` only supports the `inputs`, `vars`, and `github` contexts — NOT
  # `needs`. So the workflow ref must come from inputs, not from the plan
  # job. The expression below picks `inputs.workflow_ref` when set, otherwise
  # falls back to `inputs.ref`, so building v1.2.0 uses custom-build.yml@v1.2.0
  # and building the main branch uses custom-build.yml@main by default.
  #
  # github.repository / GITHUB_TOKEN belong to this repo, so the release is
  # published here automatically.
  # ---------------------------------------------------------------------------
  build:
    needs: plan
    uses: svenshi/oxidns/.github/workflows/custom-build.yml@${{ inputs.workflow_ref != '' && inputs.workflow_ref || inputs.ref }}
    with:
      ref:         ${{ inputs.ref }}
      release_tag: ${{ needs.plan.outputs.release_tag }}
      prerelease:  ${{ fromJson(needs.plan.outputs.prerelease) }}
      bundle:      ${{ needs.plan.outputs.bundle }}
      features:    ${{ needs.plan.outputs.features }}
      targets:     ${{ needs.plan.outputs.targets }}
      upx:         ${{ fromJson(needs.plan.outputs.upx) }}
      make_deb:    ${{ fromJson(needs.plan.outputs.make_deb) }}
    secrets: inherit
