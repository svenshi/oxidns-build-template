name: Watch Upstream

# Polls the upstream oxidns repo's latest release every 30 minutes. When a
# new version is detected, triggers build.yml and produces a matching
# release in this repo with the same tag as upstream.
#
# Manual workflow_dispatch (force: true) re-resolves the latest release
# and rebuilds it — handy for first-time setup or recovering from a failed
# previous run.
#
# When upstream has no releases yet, this workflow stays idle. To test the
# pipeline during early development, kick off `Build OxiDNS Release`
# manually with a branch / commit ref.

on:
  schedule:
    - cron: '*/30 * * * *'
  workflow_dispatch:
    inputs:
      force:
        description: 'Force rebuild even if this repo already has the tag'
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  detect:
    runs-on: ubuntu-latest
    outputs:
      new:          ${{ steps.check.outputs.new }}
      ref:          ${{ steps.check.outputs.ref }}
      workflow_ref: ${{ steps.check.outputs.workflow_ref }}
    steps:
      - uses: actions/checkout@v4

      - name: Install yq
        run: |
          sudo wget -qO /usr/local/bin/yq \
            https://github.com/mikefarah/yq/releases/latest/download/yq_linux_amd64
          sudo chmod +x /usr/local/bin/yq

      - id: check
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          FORCE: ${{ github.event.inputs.force || 'false' }}
        run: |
          set -euo pipefail
          UPSTREAM=$(yq '.upstream' build.config.yml)
          echo "upstream=$UPSTREAM"

          LATEST=$(gh release view --repo "$UPSTREAM" --json tagName -q .tagName 2>/dev/null || true)
          if [ -z "$LATEST" ]; then
            echo "::notice::upstream $UPSTREAM has no releases yet — skipping. Use 'Build OxiDNS Release' manually with a branch / commit ref to test."
            echo "new=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "latest=$LATEST"

          LAST_BUILT=$(gh release view --repo "${{ github.repository }}" \
            "$LATEST" --json tagName -q .tagName 2>/dev/null || echo "")
          echo "last_built=$LAST_BUILT"

          if [ -n "$LAST_BUILT" ] && [ "$FORCE" != "true" ]; then
            echo "new=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # Pick the workflow ref. By default we pin custom-build.yml to the
          # same ref as the source so the pipeline tracks the version it
          # builds. Fall back to `main` only when the workflow file does not
          # exist at the source ref (e.g. very old release tags from before
          # custom-build.yml was added).
          if gh api "repos/$UPSTREAM/contents/.github/workflows/custom-build.yml?ref=$LATEST" \
               --jq .name >/dev/null 2>&1; then
            WORKFLOW_REF="$LATEST"
          else
            WORKFLOW_REF=main
            echo "::notice::custom-build.yml does not exist at $UPSTREAM@$LATEST — falling back to custom-build.yml@main"
          fi

          {
            echo "new=true"
            echo "ref=$LATEST"
            echo "workflow_ref=$WORKFLOW_REF"
          } >> "$GITHUB_OUTPUT"

  trigger:
    needs: detect
    if: needs.detect.outputs.new == 'true'
    uses: ./.github/workflows/build.yml
    with:
      ref:          ${{ needs.detect.outputs.ref }}
      workflow_ref: ${{ needs.detect.outputs.workflow_ref }}
    permissions:
      contents: write
